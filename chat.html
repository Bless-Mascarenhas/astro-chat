<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroChat — The Ephemeris</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  /* Base Reset & Variables */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #08090C;
    --surface: #12141A;
    --surface-hover: #1A1D24;
    --meridian: #2A2D35;
    --text: #EAECEF;
    --accent: #C5A880; /* Aged Brass */
    --muted: #8A8F9E;
    --error: #8C4444;
  }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 2rem;
    overflow: hidden;
  }

  /* Editorial Layout / Observatory Dashboard */
  .dashboard {
    width: 100%;
    max-width: 900px;
    height: 100%;
    max-height: 850px;
    border: 1px solid var(--meridian);
    display: flex;
    flex-direction: column;
    background: var(--bg);
    position: relative;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }

  @media (max-width: 600px) {
    body { padding: 0; }
    .dashboard { border: none; max-height: none; box-shadow: none; }
    .messages { padding: 1.5rem !important; }
    .input-area { padding: 1rem !important; }
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.2rem 2rem;
    border-bottom: 1px solid var(--meridian);
    font-family: 'Cormorant Garamond', serif;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .logo-text {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .moon-phase {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    color: var(--muted);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .moon-icon {
    font-size: 1.1rem;
    color: var(--accent);
  }

  /* Loading Bar */
  .loading-bar {
    height: 1px;
    background: transparent;
    position: relative;
    overflow: hidden;
  }
  .loading-bar.active {
    background: var(--meridian);
  }
  .loading-bar.active::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 30%; height: 100%;
    background: var(--accent);
    animation: barSlide 1.5s ease-in-out infinite;
  }
  @keyframes barSlide {
    0% { left: -30%; }
    100% { left: 100%; }
  }

  /* Chat Area */
  .chat-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 2.5rem;
    display: flex;
    flex-direction: column;
    gap: 2rem;
    scrollbar-width: thin;
    scrollbar-color: var(--meridian) transparent;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: var(--meridian); }

  /* Welcome Screen */
  .welcome {
    text-align: center;
    margin: auto;
    max-width: 480px;
    padding: 2rem 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    animation: fadeIn 1s ease;
  }
  .astrolabe-svg {
    width: 220px;
    height: 220px;
    animation: slowRotate 40s linear infinite;
    opacity: 0.9;
    filter: drop-shadow(0 0 12px rgba(197, 168, 128, 0.15));
  }
  @keyframes slowRotate {
    100% { transform: rotate(360deg); }
  }

  .welcome h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.2rem;
    font-weight: 400;
    font-style: italic;
    color: var(--text);
  }
  .welcome p {
    font-size: 0.95rem;
    color: var(--muted);
    line-height: 1.6;
  }
  .suggestions {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    width: 100%;
    margin-top: 1rem;
  }
  .suggestion-btn {
    background: transparent;
    border: 1px solid var(--meridian);
    color: var(--muted);
    padding: 0.85rem 1rem;
    text-align: left;
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    justify-content: space-between;
  }
  .suggestion-btn::after {
    content: '→';
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    transform: translateX(-5px);
  }
  .suggestion-btn:hover {
    border-color: var(--accent);
    color: var(--text);
    background: var(--surface);
  }
  .suggestion-btn:hover::after {
    opacity: 1;
    transform: translateX(0);
  }

  /* Message Bubbles */
  .msg {
    display: flex;
    gap: 1rem;
    animation: fadeIn 0.4s ease;
    max-width: 85%;
  }
  .msg.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  
  .avatar {
    width: 32px;
    height: 32px;
    border: 1px solid var(--meridian);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    color: var(--accent);
    background: var(--surface);
    flex-shrink: 0;
  }
  .msg.user .avatar {
    color: var(--text);
  }

  .bubble {
    padding: 1.2rem;
    font-size: 0.95rem;
    line-height: 1.6;
    background: var(--surface);
    border: 1px solid var(--meridian);
    color: var(--text);
  }
  .msg.user .bubble {
    background: transparent;
    border-color: var(--meridian);
  }
  .msg.ai .bubble {
    border-left: 2px solid var(--accent);
  }

  /* Typing Indicator */
  .typing { display: flex; gap: 4px; align-items: center; padding: 0.5rem 0; }
  .typing span {
    width: 4px; height: 4px;
    background: var(--accent);
    opacity: 0.3;
    animation: blink 1.4s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  /* Input Area */
  .input-area {
    border-top: 1px solid var(--meridian);
    padding: 1.5rem 2rem;
    background: var(--bg);
  }
  .input-wrapper {
    display: flex;
    border: 1px solid var(--meridian);
    background: var(--surface);
    transition: border-color 0.2s;
  }
  .input-wrapper:focus-within {
    border-color: var(--accent);
  }
  
  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 0.95rem;
    padding: 1rem 1.2rem;
    resize: none;
    line-height: 1.5;
    max-height: 150px;
  }
  textarea::placeholder { color: var(--muted); }
  
  #send-btn {
    background: transparent;
    border: none;
    border-left: 1px solid var(--meridian);
    color: var(--accent);
    padding: 0 1.5rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  #send-btn:hover { 
    background: var(--surface-hover); 
    color: #EAECEF;
  }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .footer-meta {
    display: flex;
    justify-content: space-between;
    margin-top: 1rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .error-msg {
    text-align: center; padding: 0.75rem;
    border: 1px solid var(--error);
    color: var(--error);
    font-size: 0.85rem;
    font-family: 'Space Mono', monospace;
  }
</style>
</head>
<body>

<div class="dashboard">
  <header>
    <div class="logo">
      <div class="logo-text">AstroChat</div>
    </div>
    <div class="moon-phase">
      <span class="moon-icon">☾</span> Waning Crescent
    </div>
  </header>
  
  <div class="loading-bar" id="loading-bar"></div>

  <div class="chat-wrapper">
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <svg class="astrolabe-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <path id="zodiac-path" d="M 250, 85 A 165,165 0 1,1 249.9,85" />
            <path id="rune-path" d="M 250, 40 A 210,210 0 1,1 249.9,40" />
            <g id="compass-point">
              <polygon points="250,130 255,245 250,250 245,245" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
              <polygon points="250,130 255,245 250,250" fill="var(--accent)" opacity="0.3"/>
            </g>
            <g id="compass-point-small">
              <polygon points="250,160 253,247 250,250 247,247" fill="none" stroke="var(--accent)" stroke-width="1"/>
              <polygon points="250,160 253,247 250,250" fill="var(--accent)" opacity="0.2"/>
            </g>
          </defs>
          <style>
            .svg-text { font-family: 'Space Mono', monospace; font-size: 18px; fill: var(--accent); }
            .svg-zodiac { font-family: sans-serif; font-size: 26px; fill: var(--accent); }
          </style>
          <circle cx="250" cy="250" r="240" fill="none" stroke="var(--accent)" stroke-width="3"/>
          <circle cx="250" cy="250" r="232" fill="none" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 4"/>
          <circle cx="250" cy="250" r="190" fill="none" stroke="var(--accent)" stroke-width="2"/>
          <circle cx="250" cy="250" r="140" fill="none" stroke="var(--accent)" stroke-width="2"/>
          <circle cx="250" cy="250" r="132" fill="none" stroke="var(--accent)" stroke-width="1" stroke-dasharray="2 4"/>
          <circle cx="250" cy="250" r="30" fill="none" stroke="var(--accent)" stroke-width="2"/>
          <circle cx="250" cy="250" r="8" fill="var(--accent)"/>
          <line x1="10" y1="250" x2="490" y2="250" stroke="var(--accent)" stroke-width="1" opacity="0.4"/>
          <line x1="250" y1="10" x2="250" y2="490" stroke="var(--accent)" stroke-width="1" opacity="0.4"/>
          <text class="svg-text">
            <textPath href="#rune-path" startOffset="0" textLength="1310" lengthAdjust="spacing">ASTROCHAT · EPHEMERIS · VOID · NAVIGATOR · MMXXIV · CELESTIAL ·</textPath>
          </text>
          <text class="svg-zodiac">
            <textPath href="#zodiac-path" startOffset="0" textLength="1030" lengthAdjust="spacing">♈ ♉ ♊ ♋ ♌ ♍ ♎ ♏ ♐ ♑ ♒ ♓</textPath>
          </text>
          <use href="#compass-point" />
          <use href="#compass-point" transform="rotate(90 250 250)"/>
          <use href="#compass-point" transform="rotate(180 250 250)"/>
          <use href="#compass-point" transform="rotate(270 250 250)"/>
          <use href="#compass-point-small" transform="rotate(45 250 250)"/>
          <use href="#compass-point-small" transform="rotate(135 250 250)"/>
          <use href="#compass-point-small" transform="rotate(225 250 250)"/>
          <use href="#compass-point-small" transform="rotate(315 250 250)"/>
        </svg>
        <h2>Consult the Ephemeris</h2>
        <p>Seek the stars, but navigate by your own compass. Inquire about planetary transits, natal charts, or cosmic alignments.</p>
        <div class="suggestions">
          <button class="suggestion-btn" onclick="suggest(this)">Calculate the implications of my Aries Sun</button>
          <button class="suggestion-btn" onclick="suggest(this)">Define the nature of a Saturn Return</button>
          <button class="suggestion-btn" onclick="suggest(this)">Analyze Scorpio and Pisces synastry</button>
          <button class="suggestion-btn" onclick="suggest(this)">Detail the significance of astrological houses</button>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="user-input" rows="1" placeholder="Enter query..." maxlength="2000"></textarea>
        <button id="send-btn" onclick="sendMessage()">Transmit</button>
      </div>
      <div class="footer-meta">
        <span>sys.ready</span>
        <span>model: qwen3.5:4b</span>
      </div>
    </div>
  </div>
</div>

<script>
const MODEL = 'qwen3.5:4b';
const OLLAMA_URL = '/api/chat'; 

const SYSTEM_PROMPT = `You are AstroGuide, a concise and mystical astrology expert. Answer questions about zodiac signs, birth charts, planets, houses, transits, moon phases, compatibility, Mercury retrograde, and Vedic astrology. Use a slightly formal, academic tone. Avoid using emojis. Keep answers focused and under 150 words unless the user asks for more detail.`;

let history = [];
let isLoading = false;

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + 'px';
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function suggest(btn) {
  inputEl.value = btn.textContent.trim();
  inputEl.focus();
}

function appendMessage(role, content) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? 'U' : '✦';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatText(content);

  div.appendChild(avatar);
  div.appendChild(bubble);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing-indicator';

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = '✦';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

  div.appendChild(avatar);
  div.appendChild(bubble);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

function showError(msg) {
  const err = document.createElement('div');
  err.className = 'error-msg';
  err.textContent = msg;
  messagesEl.appendChild(err);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function formatText(text) {
  return text
    .replace(/<think>[\s\S]*?<\/think>/g, '')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>')
    .trim();
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || isLoading) return;

  isLoading = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = 'auto';

  document.getElementById('loading-bar').classList.add('active');

  appendMessage('user', text);
  history.push({ role: 'user', content: text });

  showTyping();

  try {
    const response = await fetch(OLLAMA_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      mode: 'cors',
      body: JSON.stringify({
        model: MODEL,
        think: false,
        options: { num_predict: 250 },
        messages: [
          { role: 'system', content: SYSTEM_PROMPT },
          ...history
        ],
        stream: true
      })
    });

    if (!response.ok) {
      throw new Error(`Ollama returned ${response.status}. Make sure Ollama is running.`);
    }

    removeTyping();
    const bubble = appendMessage('ai', '');
    let fullText = '';

    const reader = response.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      const chunk = decoder.decode(value, { stream: true });
      const lines = chunk.split('\n').filter(l => l.trim());

      for (const line of lines) {
        try {
          const data = JSON.parse(line);
          if (data.message?.content) {
            fullText += data.message.content;
            const visible = formatText(fullText);
            if (visible) bubble.innerHTML = visible;
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
        } catch {}
      }
    }

    history.push({ role: 'assistant', content: fullText });

  } catch (err) {
    removeTyping();
    showError(`Error: ${err.message || 'Connection failed.'}`);
  } finally {
    isLoading = false;
    sendBtn.disabled = false;
    document.getElementById('loading-bar').classList.remove('active');
    inputEl.focus();
  }
}
</script>
</body>
</html>
